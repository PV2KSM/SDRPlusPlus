name: Windows (SDR++ Simples)

# Compilação enxuta para Windows: só o que o projeto usa (RTL-SDR, rádio, DMR,
# ADS-B, listas/scanner, gravador, redução de ruído). Em caso de falha, as
# últimas linhas do log do passo que falhou viram anotações de erro.

on:
  push:
    branches: [ master, scanner-simples ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    env:
      LOGS: ${{ github.workspace }}/../ci-logs

    steps:
    - uses: actions/checkout@v4

    - name: Preparar pastas
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:LOGS | Out-Null
        New-Item -ItemType Directory -Force ${{ runner.workspace }}/build | Out-Null

    - name: 1 - PothosSDR (volk, rtlsdr, libusb)
      shell: pwsh
      working-directory: ${{ runner.workspace }}
      run: |
        $ErrorActionPreference = 'Continue'
        & {
          Invoke-WebRequest -Uri "https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2020.01.26-vc14-x64.exe" -OutFile pothos.exe
          New-Item -ItemType Directory -Force "C:/Program Files/PothosSDR" | Out-Null
          7z x pothos.exe -o"C:/Program Files/PothosSDR/" -y
          if ($LASTEXITCODE -ne 0) { throw "7z falhou ao extrair o PothosSDR" }
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.7z" -OutFile libusb.7z
          7z x libusb.7z -olibusb_old -y
          Copy-Item "libusb_old/MS64/dll/libusb-1.0.dll" "C:/Program Files/PothosSDR/bin/" -Force
          Copy-Item "libusb_old/MS64/dll/libusb-1.0.lib" "C:/Program Files/PothosSDR/lib/" -Force
          try {
            Invoke-WebRequest -Uri "https://ftp.osmocom.org/binaries/windows/rtl-sdr/rtl-sdr-64bit-20261018.zip" -OutFile rtl-sdr.zip
            7z x rtl-sdr.zip -y
            Copy-Item "rtl-sdr-64bit-20261018/librtlsdr.dll" "C:/Program Files/PothosSDR/bin/rtlsdr.dll" -Force
            Write-Host "librtlsdr atualizado (osmocom)"
          } catch { Write-Host "AVISO: librtlsdr novo indisponivel, usando o do PothosSDR: $_" }
          foreach ($f in @("bin/volk.dll", "lib/volk.lib", "bin/rtlsdr.dll", "include/rtl-sdr.h")) {
            if (-not (Test-Path "C:/Program Files/PothosSDR/$f")) { throw "faltando no PothosSDR: $f" }
          }
        } *>&1 | Tee-Object -FilePath "$env:LOGS/1-pothos.log"
        if (-not $?) { exit 1 }

    - name: 2 - vcpkg (fftw3, glfw3, zstd, itpp, libusb)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $trip = "C:/vcpkg/triplets/x64-windows.cmake"
        if (-not (Select-String -Path $trip -Pattern "VCPKG_BUILD_TYPE" -Quiet)) { Add-Content -Path $trip -Value "set(VCPKG_BUILD_TYPE release)" }
        vcpkg install fftw3:x64-windows glfw3:x64-windows zstd:x64-windows itpp:x64-windows libusb:x64-windows 2>&1 | Tee-Object -FilePath "$env:LOGS/2-vcpkg.log"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: 3 - RtAudio (saida de som)
      shell: pwsh
      working-directory: ${{ runner.workspace }}
      run: |
        $ErrorActionPreference = 'Continue'
        & {
          git clone https://github.com/thestk/rtaudio
          Set-Location rtaudio
          git checkout 2f2fca4502d506abc50f6d4473b2836d24cfb1e3
          New-Item -ItemType Directory build | Out-Null
          Set-Location build
          cmake ..
          cmake --build . --config Release
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar rtaudio" }
          cmake --install .
        } *>&1 | Tee-Object -FilePath "$env:LOGS/3-rtaudio.log"
        if (-not $?) { exit 1 }

    - name: 4 - Configurar (CMake)
      shell: pwsh
      working-directory: ${{ runner.workspace }}/build
      run: |
        $ErrorActionPreference = 'Continue'
        $keep = @('OPT_BUILD_RTL_SDR_SOURCE','OPT_BUILD_RTL_TCP_SOURCE','OPT_BUILD_FILE_SOURCE','OPT_BUILD_AUDIO_SINK',
                  'OPT_BUILD_RADIO','OPT_BUILD_CH_EXTRAVHF_DECODER','OPT_BUILD_ADSB_DECODER','OPT_BUILD_FREQUENCY_MANAGER',
                  'OPT_BUILD_SCANNER','OPT_BUILD_RECORDER','OPT_BUILD_NOISE_REDUCTION_LOGMMSE')
        $opts = @()
        foreach ($m in (Select-String -Path "$env:GITHUB_WORKSPACE/CMakeLists.txt" -Pattern '^option\((OPT_BUILD_[A-Z0-9_]+)').Matches) {
          $o = $m.Groups[1].Value
          $opts += "-D$o=" + $(if ($keep -contains $o) { 'ON' } else { 'OFF' })
        }
        cmake "$env:GITHUB_WORKSPACE" -DCOPY_MSVC_REDISTRIBUTABLES=ON "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" @opts 2>&1 | Tee-Object -FilePath "$env:LOGS/4-cmake.log"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: 5 - Compilar
      shell: pwsh
      working-directory: ${{ runner.workspace }}/build
      run: |
        $ErrorActionPreference = 'Continue'
        cmake --build . --config RelWithDebInfo -- /m /v:minimal "/clp:ErrorsOnly;Summary" "/flp:logfile=$env:LOGS/5-build-completo.txt;verbosity=minimal" 2>&1 | Tee-Object -FilePath "$env:LOGS/5-build.log"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: 6 - Montar pacote
      shell: pwsh
      working-directory: ${{ runner.workspace }}
      run: |
        Start-Transcript -Path "$env:LOGS/6-pacote.log" -Force | Out-Null
        try {
          $ErrorActionPreference = 'Stop'
          $out = "sdrpp_simples_windows_x64"
          $b = "${{ runner.workspace }}/build"
          Write-Host "build dir:"; Get-ChildItem $b | Select-Object Name | Format-Table | Out-String | Write-Host
          $rel = Get-ChildItem $b -Recurse -Filter sdrpp.exe | Select-Object -First 1
          if (-not $rel) { throw "sdrpp.exe nao encontrado em $b" }
          Write-Host "sdrpp.exe em: $($rel.DirectoryName)"
          New-Item -ItemType Directory -Force "$out/modules" | Out-Null
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE/root/*" $out -Force
          Copy-Item "$($rel.DirectoryName)/*" $out -Recurse -Force
          foreach ($grp in @('source_modules','sink_modules','decoder_modules','misc_modules')) {
            Get-ChildItem "$b/$grp" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $dll = Get-ChildItem $_.FullName -Recurse -Filter ($_.Name + ".dll") -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName "$out/modules/" -Force; Write-Host "modulo: $($_.Name)" }
            }
          }
          $mods = (Get-ChildItem "$out/modules" -Filter *.dll).BaseName
          Get-ChildItem $b -Recurse -Filter *.dll | Where-Object { $mods -notcontains $_.BaseName -and -not (Test-Path (Join-Path $out $_.Name)) } |
            ForEach-Object { Copy-Item $_.FullName $out -Force; Write-Host "dll extra: $($_.Name)" }
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/*.dll" $out -Force
          foreach ($f in @('volk.dll','rtlsdr.dll','libusb-1.0.dll','pthreadVC2.dll')) {
            if (Test-Path "C:/Program Files/PothosSDR/bin/$f") { Copy-Item "C:/Program Files/PothosSDR/bin/$f" $out -Force }
          }
          $rta = Get-ChildItem "C:/Program Files (x86)/RtAudio", "C:/Program Files/RtAudio" -Recurse -Filter rtaudio.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rta) { Copy-Item $rta.FullName $out -Force } else { Write-Host "AVISO: rtaudio.dll nao encontrado" }
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          Get-ChildItem $out, "$out/modules" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
        } catch {
          Write-Host "FALHA: $($_.Exception.Message)"
          Write-Host $_.InvocationInfo.PositionMessage
          Stop-Transcript | Out-Null
          exit 1
        }
        Stop-Transcript | Out-Null

    - name: Salvar pacote
      uses: actions/upload-artifact@v4
      with:
        name: sdrpp_simples_windows_x64
        path: ${{ runner.workspace }}/sdrpp_simples_windows_x64.zip

    - name: Relatar erro (anotacoes)
      if: failure()
      shell: pwsh
      run: |
        function Enc([string]$s) { return $s.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A') }
        $logs = Get-ChildItem $env:LOGS -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
        if (-not $logs) { Write-Host "::error title=sem logs::nenhum log encontrado (falha antes dos passos numerados)"; exit 0 }
        $last = $logs | Where-Object { Select-String -Path $_.FullName -Pattern '^FALHA:' -Quiet } | Select-Object -Last 1
        if (-not $last) { $last = $logs[-1] }
        Write-Host ("::error title=passos registrados::" + (($logs | ForEach-Object { $_.Name + ' (' + $_.Length + ' bytes)' }) -join ' | '))
        $lines = Get-Content $last.FullName
        $errs = $lines | Select-String -Pattern ': (fatal )?error [A-Z]+\d+|error LNK\d+|CMake Error|unresolved external|Cannot open|^FALHA:|At line|falhou|faltando' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 30
        if ($errs) { Write-Host ("::error title=$($last.Name) - linhas com erro::" + (Enc (($errs | ForEach-Object { $_.Substring(0, [Math]::Min(300, $_.Length)) }) -join "`n"))) }
        $tail = $lines | Where-Object { $_ -notmatch 'warning C\d+|template instantiation|see reference|while compiling|compiling source|^\s*(with|\[|\]|T=)' -and $_.Trim() } | Select-Object -Last 40 | ForEach-Object { $_.Substring(0, [Math]::Min(250, $_.Length)) }
        $chunk = @(); $n = 0
        foreach ($l in $tail) {
          $chunk += $l
          if ((($chunk -join "`n").Length) -gt 3000) { $n++; Write-Host ("::error title=$($last.Name) - final $n::" + (Enc ($chunk -join "`n"))); $chunk = @() }
        }
        if ($chunk.Count) { $n++; Write-Host ("::error title=$($last.Name) - final $n::" + (Enc ($chunk -join "`n"))) }
